# Deploy per CLI: npm run build && npx wrangler deploy
# Alternativ dist/munsch-zentrale-worker.js im Cloudflare-Dashboard einfügen (siehe docs/BETRIEB.md).
name = "munsch-zentrale"
main = "dist/munsch-zentrale-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "munsch-zentrale"
database_id = "HIER-DIE-D1-ID-EINTRAGEN"

# Secrets (nie in diese Datei):
#   npx wrangler secret put PIN_LEAD   # Notfall-PIN der Teamleitung, mindestens 12 Zeichen
#   npx wrangler secret put PPLX_KEY   # optional, Perplexity

# Nächtliche Sicherung und Aufräumen (03:17 UTC). Ohne R2-Bindung wird nur aufgeräumt.
[triggers]
crons = ["17 3 * * *"]

# Optional: Sicherungen in R2 (30 Tage). Bucket vorher anlegen: npx wrangler r2 bucket create munsch-sicherung
# [[r2_buckets]]
# binding = "BACKUP"
# bucket_name = "munsch-sicherung"
