<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUNSCH Flow</title>
<meta name="theme-color" content="#0A0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Leitstand als Filmbild – schmale Kommandoleiste links, breite Bühne mit Szenen, Kennzahlen als Filmtitel */
:root{
 --ground:#0A0B0D;--stage:#0F1114;--panel:#14171B;--panel2:#1A1E23;--glass:rgba(20,23,27,.72);
 --line:rgba(255,236,220,.075);--line2:rgba(255,236,220,.15);
 --ink:#F3EFEA;--ink2:#B8B1A9;--ink3:#7B756E;
 --signal:#FF761B;--signal2:#FFA25E;--signal-soft:rgba(255,118,27,.13);--signal-ink:#140A03;
 --ok:#4FD1A1;--warn:#F5B14A;--crit:#FF5A64;--info:#7CC4FF;
 --ok-soft:rgba(79,209,161,.13);--warn-soft:rgba(245,177,74,.14);--crit-soft:rgba(255,90,100,.14);--info-soft:rgba(124,196,255,.12);
 --shadow:0 30px 70px -30px rgba(0,0,0,.85);
 --light-a:rgba(255,128,48,.16);--light-b:rgba(255,160,90,.07);
 --display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;
 --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
 --mono:'JetBrains Mono','Cascadia Mono',ui-monospace,monospace;
 --r:14px;--r2:22px;--ease:cubic-bezier(.2,.8,.2,1);
 color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --ground:#E9E6E1;--stage:#F3F1ED;--panel:#FFFFFF;--panel2:#F6F3EF;--glass:rgba(255,255,255,.78);
 --line:rgba(40,24,10,.09);--line2:rgba(40,24,10,.17);
 --ink:#17130F;--ink2:#564F47;--ink3:#857D74;
 --signal:#E05E00;--signal2:#FF761B;--signal-soft:rgba(224,94,0,.10);--signal-ink:#FFFFFF;
 --ok:#11895A;--warn:#A86A06;--crit:#CF3440;--info:#2470B8;
 --ok-soft:rgba(17,137,90,.11);--warn-soft:rgba(168,106,6,.12);--crit-soft:rgba(207,52,64,.10);--info-soft:rgba(36,112,184,.10);
 --shadow:0 24px 50px -30px rgba(60,40,20,.35);--light-a:rgba(255,140,60,.18);--light-b:rgba(255,170,110,.10);
 color-scheme:light}}
:root[data-theme="light"]{
 --ground:#E9E6E1;--stage:#F3F1ED;--panel:#FFFFFF;--panel2:#F6F3EF;--glass:rgba(255,255,255,.78);
 --line:rgba(40,24,10,.09);--line2:rgba(40,24,10,.17);
 --ink:#17130F;--ink2:#564F47;--ink3:#857D74;
 --signal:#E05E00;--signal2:#FF761B;--signal-soft:rgba(224,94,0,.10);--signal-ink:#FFFFFF;
 --ok:#11895A;--warn:#A86A06;--crit:#CF3440;--info:#2470B8;
 --ok-soft:rgba(17,137,90,.11);--warn-soft:rgba(168,106,6,.12);--crit-soft:rgba(207,52,64,.10);--info-soft:rgba(36,112,184,.10);
 --shadow:0 24px 50px -30px rgba(60,40,20,.35);--light-a:rgba(255,140,60,.18);--light-b:rgba(255,170,110,.10);
 color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* ---------- Licht der Halle ---------- */
#light{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#light::before,#light::after{content:"";position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(20px)}
#light::before{left:-25vmax;top:-45vmax;background:radial-gradient(closest-side,var(--light-a),transparent);animation:drift 26s ease-in-out infinite}
#light::after{right:-35vmax;bottom:-55vmax;background:radial-gradient(closest-side,var(--light-b),transparent);animation:drift 34s ease-in-out infinite reverse}
html.crit #light::before{background:radial-gradient(closest-side,rgba(255,90,100,.14),transparent)}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45))}
:root[data-theme="light"] #vignette{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #vignette{display:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.08)}}

/* ---------- Gerüst ---------- */
#app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
.rail{grid-row:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 16px;padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 40%)}
.rail .mark{width:44px;height:44px;margin-bottom:14px;display:grid;place-items:center}
.rail .mark svg{width:40px;height:40px}
.rb{position:relative;width:56px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--ink3);transition:color .2s,background .25s}
.rb svg{width:22px;height:22px}
.rb:hover{color:var(--ink);background:var(--panel)}
.rb.on{color:var(--signal);background:var(--signal-soft)}
.rb.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--signal);box-shadow:0 0 14px var(--signal)}
.rb .bd{position:absolute;top:7px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--crit);color:#fff;font:600 10px/17px var(--mono);text-align:center}
.rb .tip{position:absolute;left:66px;top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;white-space:nowrap;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font:500 13px var(--body);transition:.18s;z-index:30;box-shadow:var(--shadow)}
.rb:hover .tip{opacity:1;transform:translate(0,-50%)}
.rail .sp{flex:1}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--signal2),var(--signal));color:var(--signal-ink);font:700 14px var(--body);letter-spacing:.02em}

/* Seitenblatt der Gruppe */
#flyout{position:fixed;left:84px;top:0;bottom:0;width:300px;z-index:40;background:var(--glass);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);border-right:1px solid var(--line2);padding:26px 18px;transform:translateX(-12px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s;box-shadow:var(--shadow)}
#flyout.on{transform:none;opacity:1;pointer-events:auto}
#flyout h3{margin:0 0 4px;font:700 34px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
#flyout .sub{color:var(--ink3);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
#flyout button{display:flex;width:100%;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;color:var(--ink2);font-size:15px;transition:background .15s,color .15s}
#flyout button:hover{background:var(--panel2);color:var(--ink)}
#flyout button.on{color:var(--ink);background:var(--signal-soft)}
#flyout button .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
#flyout button.on .dot{background:var(--signal);box-shadow:0 0 10px var(--signal)}
#flyout button .later{margin-left:auto;font:500 10px var(--mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
#flyout button .n{margin-left:auto;font:600 11px var(--mono);color:var(--warn)}

/* Kopfzeile */
.top{grid-column:2;display:flex;align-items:center;gap:14px;padding:16px max(28px,env(safe-area-inset-right,0px)) 10px 36px;min-width:0}
.ttl{min-width:0;flex:1}
.ttl .eb{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
.ttl h1{margin:0;padding-top:.08em;font:700 clamp(30px,3.4vw,46px)/1.02 var(--display);letter-spacing:.005em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;min-width:240px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink3);transition:border-color .2s,color .2s}
.srch:hover{border-color:var(--signal);color:var(--ink2)}
.srch svg{width:17px;height:17px}
.srch span{flex:1;text-align:left;font-size:14px}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--line2);border-bottom-width:2px;font:600 11px var(--mono);color:var(--ink2);background:var(--panel2)}
.ib{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);transition:.2s}
.ib:hover{color:var(--ink);border-color:var(--signal)}
.ib svg{width:18px;height:18px}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font:600 10px/18px var(--mono)}
.live{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:beat 2.4s infinite}
.live.off i{background:var(--warn);animation:none}
.live.demo i{background:var(--info);animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(79,209,161,.55)}70%{box-shadow:0 0 0 9px rgba(79,209,161,0)}100%{box-shadow:0 0 0 0 rgba(79,209,161,0)}}
.clock{text-align:right;line-height:1}
.clock b{display:block;font:700 40px/.9 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock span{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}

/* Newsflash */
.tick{grid-column:2;margin:0 max(28px,env(safe-area-inset-right,0px)) 0 36px;height:34px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;min-width:0}
.tick .lb{flex:none;display:flex;align-items:center;gap:8px;font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--signal);text-transform:uppercase}
.tick .lb i{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:beat 2.4s infinite}
.tick .tr{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick .tm{display:inline-flex;gap:46px;white-space:nowrap;animation:marq var(--dur,60s) linear infinite;padding-left:20px}
.tick .tm span{font-size:13px;color:var(--ink2)}
.tick .tm b{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--signal);margin-right:9px}
.tick:hover .tm{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

/* Bühne */
#stage{grid-column:2;overflow-y:auto;overflow-x:hidden;padding:26px max(28px,env(safe-area-inset-right,0px)) 80px 36px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;min-width:0}
.scene{display:flex;flex-direction:column;gap:22px;max-width:1480px}
.enter .scene > *{animation:rise .8s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
.row{display:grid;gap:18px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.r-23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}

/* Flächen */
.card{position:relative;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 80%,var(--ground)));border:1px solid var(--line);border-radius:var(--r2);padding:22px 24px;min-width:0;box-shadow:var(--shadow);isolation:isolate}
.card.flat{background:transparent;box-shadow:none;border-style:dashed}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-width:0}
.ch h2{margin:0;font:600 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.ch .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.ch .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dim{color:var(--ink3)}
.lead{font-size:16px;color:var(--ink2);max-width:62ch;margin:0}

/* Kennzahl-Kachel */
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px 22px 18px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--line);min-width:0;overflow:hidden;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s;isolation:isolate}
button.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
.tile .k{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.tile .v{font:700 clamp(46px,5vw,72px)/.85 var(--display);letter-spacing:-.005em;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .v small{font-size:.42em;color:var(--ink3);margin-left:4px;letter-spacing:.02em}
.tile .s{font-size:13px;color:var(--ink2)}
.tile .spark{margin-top:auto;height:34px}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.crit .v{color:var(--crit)}
.tile.crit{border-color:color-mix(in srgb,var(--crit) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--crit) 20%,transparent),0 20px 60px -30px var(--crit)}
.tile .stripe{position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.tile.ok .stripe{background:var(--ok)}.tile.warn .stripe{background:var(--warn)}.tile.crit .stripe{background:var(--crit)}
.meter{display:flex;gap:3px;margin-top:6px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.meter i.on{background:linear-gradient(90deg,var(--signal2),var(--signal))}
.tile.ok .meter i.on{background:var(--ok)}.tile.warn .meter i.on{background:var(--warn)}.tile.crit .meter i.on{background:var(--crit)}
.enter .meter i.on{animation:seg .6s var(--ease) both;animation-delay:calc(var(--i,0)*35ms + 250ms)}
@keyframes seg{from{transform:scaleX(.1);opacity:.2}}

/* Chips und Knöpfe */
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.chip.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft)}
.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-soft)}
.chip.sig{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 45%,transparent);background:var(--signal-soft)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font:600 14px var(--body);white-space:nowrap;transition:transform .15s,border-color .2s,background .2s,box-shadow .25s}
.btn:hover{border-color:color-mix(in srgb,var(--signal) 60%,var(--line2))}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.pri{background:linear-gradient(180deg,var(--signal2),var(--signal));color:var(--signal-ink);border-color:transparent;box-shadow:0 12px 30px -12px var(--signal)}
.btn.pri:hover{box-shadow:0 16px 40px -12px var(--signal)}
.btn.ghost{background:transparent}
.btn.no{color:var(--crit)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}
.btn.xl{height:58px;padding:0 26px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.rp{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,220,190,.6),rgba(255,160,90,0) 70%);animation:rp .6s ease-out forwards}
@keyframes rp{to{transform:scale(30);opacity:0}}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 13px;border-radius:9px;font:500 13px var(--body);color:var(--ink2);transition:.2s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 0 var(--line2),0 6px 16px -8px rgba(0,0,0,.6)}
.seg button .c{margin-left:6px;font:600 11px var(--mono);color:var(--ink3)}

/* Formulare */
.fl{display:flex;flex-direction:column;gap:7px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);min-width:0}
.in{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--stage);font:500 15px var(--body);text-transform:none;letter-spacing:0;width:100%;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:0;border-color:var(--signal);box-shadow:0 0 0 4px var(--signal-soft)}
textarea.in{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.in.scan{height:76px;font:700 40px var(--display);letter-spacing:.08em;text-align:left;padding:0 20px}
.frm{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.frm > .fl{flex:1 1 170px}
.frm > .fl.w2{flex:2 1 260px}

/* Tabellen */
.tw{overflow-x:auto;margin:0 -6px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:0 12px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr{transition:background-color .15s}
table.t tbody tr:hover{background:var(--signal-soft)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;text-align:center;color:var(--ink3)}
.empty b{font:700 24px var(--display);text-transform:uppercase;color:var(--ink2);letter-spacing:.02em}

/* Pipeline (Status als Strecke) */
.pipe{display:flex;gap:3px;min-width:120px}
.pipe i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.pipe i.on{background:var(--signal)}
.pipe.done i.on{background:var(--ok)}
.stp{display:flex;align-items:center;gap:8px}
.stp .lbl{min-width:120px;font-size:13px}
.stp button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
.stp button:hover{border-color:var(--signal);color:var(--ink)}
.stp button[disabled]{opacity:.3;pointer-events:none}

/* ---------- Lagebild: Schichtpuls ---------- */
.hero{position:relative;padding:30px 32px 26px;border-radius:28px;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--signal) 14%,var(--panel)),var(--panel) 55%);border:1px solid var(--line2);overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,transparent 30%,rgba(255,210,170,.06) 45%,transparent 60%);transform:translateX(-100%);animation:sweep 9s var(--ease) infinite}
@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero .hl{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
.hero .gr{font:700 clamp(44px,6.2vw,96px)/.86 var(--display);text-transform:uppercase;letter-spacing:-.005em;margin:0;text-wrap:balance}
.hero .gr em{font-style:normal;color:var(--signal)}
.hero .st{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.hero .st b{font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.hero .st span{color:var(--ink2);font-size:14px}
.tl{position:relative;margin-top:34px;height:96px}
.tl .base{position:absolute;left:0;right:0;top:46px;height:4px;border-radius:4px;background:var(--line2)}
.tl .done{position:absolute;left:0;top:46px;height:4px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--signal) 30%,transparent),var(--signal));box-shadow:0 0 18px color-mix(in srgb,var(--signal) 60%,transparent);transition:width 1.2s var(--ease)}
.enter .tl .done{animation:grow 1.6s var(--ease) both .3s}
@keyframes grow{from{width:0}}
.tl .now{position:absolute;top:22px;width:2px;height:52px;margin-left:-1px;background:var(--ink);box-shadow:0 0 12px var(--signal);transition:left 1.2s var(--ease)}
.tl .now span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:600 11px var(--mono);color:var(--ink);background:var(--signal);color:var(--signal-ink);padding:2px 7px;border-radius:6px;white-space:nowrap}
.tl .bead{position:absolute;top:36px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);display:grid;place-items:center;font:700 9.5px var(--mono);color:var(--ink3);transition:transform .25s var(--ease),border-color .2s,background .2s}
.tl .bead:hover{transform:scale(1.25);border-color:var(--signal);color:var(--ink);z-index:2}
.tl .bead.ok{background:var(--ok);border-color:var(--ok);color:var(--signal-ink)}
.tl .bead.warn{border-color:var(--warn);color:var(--warn)}
.tl .bead.crit{border-color:var(--crit);color:var(--crit);animation:pulse 1.6s infinite}
.tl .bead.run{border-color:var(--signal);color:var(--signal);animation:pulse 1.6s infinite}
.tl .bead.x{background:var(--panel2);border-style:dashed;text-decoration:line-through}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tl .mk{position:absolute;top:66px;transform:translateX(-50%);font:500 10.5px var(--mono);color:var(--ink3);white-space:nowrap}
.tl .ev{position:absolute;top:4px;transform:translateX(-50%);font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.tl .ev::after{content:"";position:absolute;left:50%;top:18px;width:1px;height:22px;background:var(--line2)}
.kp{display:flex;gap:26px;flex-wrap:wrap;margin-top:8px}
.kp div{display:flex;flex-direction:column}
.kp b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kp span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* Warnlage */
.al{display:flex;flex-direction:column;gap:8px}
.al button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left;transition:transform .2s var(--ease),border-color .2s}
.al button:hover{transform:translateX(4px);border-color:var(--line2)}
.al i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.al .crit i{background:var(--crit);box-shadow:0 0 12px var(--crit)}
.al .warn i{background:var(--warn)}
.al .vio i{background:#B48CFF}
.al span{flex:1;font-size:14.5px}
.al svg{width:16px;height:16px;color:var(--ink3)}
.calm{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;background:var(--ok-soft);color:var(--ok)}
.calm b{font:700 22px var(--display);text-transform:uppercase}

/* Fachkarte */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--stage);font:600 9.5px var(--mono);color:var(--ink3);display:grid;place-items:center;transition:transform .2s var(--ease),box-shadow .2s,opacity .25s}
.cell:hover{transform:scale(1.18);z-index:3;box-shadow:0 10px 24px -8px rgba(0,0,0,.7);border-color:var(--signal)}
.cell.o{background:color-mix(in srgb,var(--signal) calc(var(--a,30)*1%),var(--stage));color:var(--ink);border-color:transparent}
.cell.lg{background:color-mix(in srgb,var(--ink3) 30%,var(--stage));color:var(--ink2)}
.cell.ll{background:var(--crit);color:#fff;border-color:transparent;animation:pulse 2.2s infinite}
.cell.dim2{opacity:.16}
.cell.hit{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.enter .cell{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*3ms + 200ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line)}
.next{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.next b{font:700 64px/1 var(--display);letter-spacing:.04em;color:var(--signal)}
.fd{display:flex;flex-direction:column;gap:14px}
.fd .big{font:700 72px/1 var(--display);letter-spacing:.03em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--ink3);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}

/* Milkrun */
.runs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.run{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);min-width:0;overflow:hidden;isolation:isolate}
.run .no{font:600 11px var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
.run .tm{font:700 44px/.9 var(--display);font-variant-numeric:tabular-nums}
.run .ss{font-size:13px;color:var(--ink2);min-height:20px}
.run .bar{height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.run .bar i{display:block;height:100%;background:var(--signal);transition:width 1s linear}
.run.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.run.ok .tm{color:var(--ok)}
.run.run-on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal),0 24px 60px -30px var(--signal)}
.run.crit{border-color:var(--crit)}
.run.crit .tm{color:var(--crit)}
.run.warn .tm{color:var(--warn)}
.run.x{opacity:.55}
.run .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}

/* Tageszahlen */
.tzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tzf{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tzf:last-child{border-bottom:0}
.tzf label{flex:1;font-size:14px;color:var(--ink2);min-width:0}
.step{display:flex;align-items:center;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--stage)}
.step button{width:34px;height:36px;color:var(--ink2);font-size:18px}
.step button:hover{background:var(--signal-soft);color:var(--signal)}
.step input{width:62px;height:36px;border:0;background:transparent;text-align:center;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.step input:focus{outline:0;background:var(--signal-soft)}
.dsw{display:flex;align-items:center;gap:8px}
.dsw b{font:700 24px var(--display);text-transform:uppercase;min-width:190px;text-align:center}

/* Anwesenheit */
.board{display:grid;gap:3px;font-size:12px;min-width:720px}
.board .hd{font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink3);text-align:center;padding:4px 0;text-transform:uppercase}
.board .hd.we{opacity:.4}
.board .hd.today{color:var(--signal)}
.board .nm{display:flex;align-items:center;font-size:13.5px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .c{height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);transition:transform .15s}
.board .c:hover{transform:scale(1.12);border-color:var(--signal)}
.board .c.we{background:transparent;border-style:dashed;opacity:.35;pointer-events:none}
.board .c.U{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.board .c.K{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 50%,transparent)}
.board .c.F{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.board .c.b{background-image:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--info) 30%,transparent) 4px 6px)}
.board .sum{font:700 15px var(--display);text-align:center;padding-top:6px;font-variant-numeric:tabular-nums}
.board .sum.low{color:var(--crit)}

/* Funk */
.funk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;min-height:520px}
.chs{display:flex;flex-direction:column;gap:4px}
.chs button{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;color:var(--ink2);text-align:left;font-size:14px}
.chs button:hover{background:var(--panel2)}
.chs button.on{background:var(--signal-soft);color:var(--ink)}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding-right:4px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--panel2);border:1px solid var(--line);animation:rise .4s var(--ease) both}
.msg.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 30%,transparent)}
.msg small{display:block;font:500 10.5px var(--mono);color:var(--ink3);margin-bottom:3px;letter-spacing:.04em}
.post{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.post.pin{border-color:color-mix(in srgb,var(--signal) 50%,transparent);background:linear-gradient(180deg,var(--signal-soft),var(--panel2))}
.post .meta{display:flex;gap:10px;align-items:center;font:500 11px var(--mono);color:var(--ink3);letter-spacing:.04em}
.post p{margin:0;font-size:15.5px}

/* ---------- Ebenen: Fenster, Seitenlade, Suche, Toast ---------- */
.veil{position:fixed;inset:0;z-index:80;background:rgba(5,6,8,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.dlg{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:26px;box-shadow:0 40px 100px -30px #000;animation:dlg .45s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(20px) scale(.97)}}
.dlg h3{margin:0 0 6px;font:700 30px/1 var(--display);text-transform:uppercase}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:85;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line2);padding:28px max(26px,env(safe-area-inset-right,0px)) 28px 26px;overflow:auto;box-shadow:-40px 0 90px -30px #000;animation:drw .45s var(--ease)}
@keyframes drw{from{transform:translateX(40px);opacity:0}}
#pal{position:fixed;inset:0;z-index:95;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:rgba(5,6,8,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s}
#pal .pb{width:min(680px,100%);border-radius:20px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 40px 100px -30px #000;overflow:hidden;animation:dlg .35s var(--ease)}
#pal .pq{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
#pal .pq svg{width:19px;height:19px;color:var(--signal);flex:none}
#pal .pq input{flex:1;height:60px;border:0;background:none;font-size:18px;outline:0}
#pal .pl{max-height:52vh;overflow:auto;padding:8px}
#pal .pi{display:flex;width:100%;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;text-align:left}
#pal .pi.on{background:var(--signal-soft)}
#pal .pi .pk{width:96px;flex:none;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
#pal .pi .pt{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pal .pi .ps{font-size:12.5px;color:var(--ink3);white-space:nowrap}
#pal .pf{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);flex-wrap:wrap}
.pxb{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;margin:14px 0}
.pxq{align-self:flex-end;max-width:85%;padding:9px 13px;border-radius:14px;background:var(--signal-soft);font-size:14px}
.pxa{font-size:15px;line-height:1.55}
.pxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pxs a{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);text-decoration:none}
.pxs a:hover{border-color:var(--signal);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:120;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:14px;overflow:hidden;animation:toast .45s var(--ease);max-width:calc(100vw - 32px)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none;box-shadow:0 0 12px var(--signal)}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--signal);transform-origin:left;animation:tb 3.4s linear forwards}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes tb{to{transform:scaleX(0)}}
.fx-chg{animation:chg 2.2s ease-out}
@keyframes chg{0%{box-shadow:0 0 0 1px var(--signal),0 0 50px -6px var(--signal)}100%{box-shadow:0 0 0 1px transparent}}
.dlt{position:absolute;top:14px;right:14px;z-index:3;padding:3px 8px;border-radius:999px;font:600 11px var(--mono);background:var(--signal-soft);color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);animation:dlt 2.6s ease-out forwards}
.dlt.dn{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
@keyframes dlt{0%{opacity:0;transform:translateY(5px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-5px)}}
.spot{position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .35s;background:radial-gradient(300px circle at var(--mx) var(--my),var(--signal-soft),transparent 60%)}
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(220px circle at var(--mx) var(--my),color-mix(in srgb,var(--signal2) 80%,transparent),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.hov > .spot{opacity:1}
.gh{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;padding:9px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;color:var(--ink2);box-shadow:var(--shadow);animation:toast .3s var(--ease)}
.gh b{color:var(--signal);font-family:var(--mono)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;align-items:center;margin-top:14px}
.keys span:nth-child(odd){display:flex;gap:4px}

/* ---------- Auftakt (Kino) ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#050506;display:grid;place-items:center;overflow:hidden;cursor:pointer}
#intro .lb{position:absolute;left:0;right:0;height:13vh;background:#000;z-index:3;transition:transform 1.1s var(--ease)}
#intro .lb.t{top:0}#intro .lb.b{bottom:0}
#intro.out .lb.t{transform:translateY(-100%)}#intro.out .lb.b{transform:translateY(100%)}
#intro.out{background:transparent;transition:background .9s ease .25s}
#intro.out .skip{opacity:0;transition:opacity .3s}
#intro.out .core{opacity:0;transform:scale(1.15);filter:blur(10px);transition:all .8s var(--ease)}
#intro .core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:26px}
#intro .ring{width:min(180px,40vw);height:min(180px,40vw);opacity:0;animation:ignite 1.4s var(--ease) .25s forwards}
#intro .ring svg{width:100%;height:100%}
#intro .ring .imp{transform-origin:65.3px 65.3px;animation:spin 3.2s var(--ease) .3s forwards}
@keyframes ignite{0%{opacity:0;transform:scale(.7);filter:blur(14px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(-200deg)}to{transform:rotate(0)}}
#intro .word{overflow:hidden}
#intro .word svg{height:min(40px,7vw);display:block;transform:translateY(110%);animation:upw .9s var(--ease) 1.05s forwards}
@keyframes upw{to{transform:none}}
#intro .line{width:0;height:1px;background:linear-gradient(90deg,transparent,#FF761B,transparent);animation:line 1.4s var(--ease) .7s forwards}
@keyframes line{to{width:min(560px,80vw)}}
#intro .cap{font:500 12px var(--mono);letter-spacing:.42em;color:#B8B1A9;text-transform:uppercase;opacity:0;animation:fade2 .9s ease 1.6s forwards;text-align:center}
#intro .cap b{color:#FF761B;font-weight:600}
@keyframes fade2{to{opacity:1}}
#intro .flare{position:absolute;width:120vmax;height:2px;left:50%;top:50%;margin-left:-60vmax;background:linear-gradient(90deg,transparent,rgba(255,170,110,.55),transparent);opacity:0;animation:flare 1.8s ease 1.2s forwards;z-index:1}
@keyframes flare{0%{opacity:0;transform:scaleX(.2)}40%{opacity:.9}100%{opacity:0;transform:scaleX(1)}}
#intro .skip{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(13vh + 18px);z-index:4;font:500 11px var(--mono);letter-spacing:.2em;color:#7B756E;text-transform:uppercase}

/* ---------- Anmeldung ---------- */
#login{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;justify-content:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));overflow:auto;background:radial-gradient(90% 70% at 15% 0%,color-mix(in srgb,var(--signal) 13%,transparent),transparent 60%),var(--ground)}
#login .in2{width:min(1100px,100%);margin:0 auto;display:flex;flex-direction:column;gap:30px}
#login .eb{font:500 12px var(--mono);letter-spacing:.3em;color:var(--signal);text-transform:uppercase}
#login h1{margin:6px 0 0;font:700 clamp(52px,8vw,120px)/.84 var(--display);text-transform:uppercase;letter-spacing:-.01em}
#login .ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .3s var(--ease),border-color .2s,opacity .3s;animation:rise .7s var(--ease) both;animation-delay:calc(var(--n)*45ms + 100ms)}
.pc:hover{transform:translateY(-3px);border-color:var(--signal)}
.pc .av{width:42px;height:42px;flex:none}
.pc b{display:block;font-size:15px}
.pc small{color:var(--ink3);font-size:12px}
.pc.last{border-color:color-mix(in srgb,var(--signal) 50%,transparent)}
#login.sel .pc:not(.cur){opacity:.15;pointer-events:none}
.pin{display:flex;flex-direction:column;gap:18px;max-width:380px}
.dots{display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.2s}
.dots i.on{background:var(--signal);border-color:var(--signal);box-shadow:0 0 12px var(--signal)}
.dots.bad i{border-color:var(--crit)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:700 26px var(--display);transition:.15s}
.pad button:hover{border-color:var(--signal)}
.pad button:active{transform:scale(.96);background:var(--signal-soft)}
.welcome{position:fixed;inset:0;z-index:160;display:grid;place-items:center;background:var(--ground);animation:fade .3s}
.welcome h2{font:700 clamp(56px,10vw,150px)/.85 var(--display);text-transform:uppercase;margin:0;text-align:center}
.welcome h2 span{display:block;overflow:hidden}
.welcome h2 span i{display:block;font-style:normal;transform:translateY(105%);animation:upw .8s var(--ease) forwards}
.welcome h2 span:nth-child(2) i{animation-delay:.12s;color:var(--signal)}
.welcome.out{opacity:0;transform:scale(1.04);transition:opacity .6s ease,transform .8s var(--ease)}

/* ---------- Werkstattmonitor (Kino) ---------- */
#mon{position:fixed;inset:0;z-index:170;background:var(--ground);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
#mon .mh{display:flex;align-items:center;gap:22px;padding:26px max(40px,env(safe-area-inset-right,0px)) 10px max(40px,env(safe-area-inset-left,0px))}
#mon .mh .t{flex:1;font:700 30px var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:14px}
#mon .mh .t i{width:12px;height:12px;border-radius:50%;background:var(--crit);animation:beat 2s infinite}
#mon .mh .clk{font:700 64px/.9 var(--display);font-variant-numeric:tabular-nums}
#mon .sc{position:relative;margin:0 max(40px,env(safe-area-inset-right,0px)) 0 max(40px,env(safe-area-inset-left,0px));overflow:hidden}
#mon .sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:28px;opacity:0;transform:scale(1.03);transition:opacity 1.1s ease,transform 12s linear}
#mon .sl.on{opacity:1;transform:scale(1)}
#mon .sl .kk{font:600 16px var(--mono);letter-spacing:.3em;color:var(--signal);text-transform:uppercase}
#mon .sl .hv{text-transform:uppercase;font:800 clamp(110px,19vw,300px)/.84 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#mon .sl .hv small{font-size:.3em;color:var(--ink3);letter-spacing:.02em}
#mon .sl .hs{font-size:clamp(20px,2.2vw,34px);color:var(--ink2)}
#mon .sl .gridm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
#mon .sl .gridm div{padding:26px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
#mon .sl .gridm b{display:block;font:800 clamp(56px,7vw,110px)/.9 var(--display);font-variant-numeric:tabular-nums}
#mon .sl .gridm span{font:600 13px var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
#mon .mf{display:flex;gap:8px;padding:18px max(40px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(40px,env(safe-area-inset-left,0px));align-items:center}
#mon .mf i{flex:1;height:3px;border-radius:3px;background:var(--line2);overflow:hidden}
#mon .mf i b{display:block;height:100%;width:0;background:var(--signal)}
#mon .mf i.on b{animation:mbar var(--d) linear forwards}
#mon .mf i.done b{width:100%}
@keyframes mbar{to{width:100%}}

 var el=document.createElement('div');el.id='login';el.innerHTML='<div class="in2"><div><div class="eb">MUNSCH Flow · Anmeldung</div><h1>'+(h<11?'Guten Morgen':h<17?'Guten Tag':'Guten Abend')+'.<br><span style="color:var(--signal)">Wer bist du?</span></h1></div><div class="ppl" id="ppl">'+ppl.map(function(m,i){return '<button class="pc'+(m.n===last?' last':'')+'" style="--n:'+i+'" data-act="lsel" data-u="'+esc(m.n)+'"><span class="av">'+esc(initials(m.n))+'</span><span><b>'+esc(m.n)+'</b><small>'+esc(m.role)+'</small></span></button>'}).join('')+'</div><div id="lpin"></div></div>';
 document.body.appendChild(el)}
ACT.lsel=function(d){var el=$('#login');if(LOG.cur===d.u){return lback()}LOG.cur=d.u;LOG.pin='';$$('.pc',el).forEach(function(p){p.classList.toggle('cur',p.dataset.u===d.u)});el.classList.add('sel');
 var srv=window.SY&&SY.on;$('#lpin').innerHTML=srv?'<div class="pin"><div class="fl">PIN für '+esc(d.u)+' · mindestens 6 Zeichen</div><div class="dots" id="ldots"></div><input id="lpi" class="in mono" type="password" inputmode="numeric" autocomplete="current-password" style="position:absolute;opacity:0;pointer-events:none;width:1px" aria-label="PIN"><div class="pad">'+['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(function(k){return '<button data-act="lk" data-k="'+k+'"'+(k==='✓'?' style="background:linear-gradient(180deg,var(--signal2),var(--signal));color:var(--signal-ink)"':'')+'>'+k+'</button>'}).join('')+'</div><button class="btn ghost" data-act="lback">Andere Person</button></div>'
  :'<div class="pin"><p class="lead">Ohne Zentrale: Daten bleiben auf diesem Gerät, Anmeldung ohne PIN.</p><div style="display:flex;gap:10px"><button class="btn pri xl" data-act="lgo">Als '+esc(firstName(d.u))+' starten</button><button class="btn ghost xl" data-act="lback">Zurück</button></div></div>';
 ldots();var i=$('#lpi');if(i){i.addEventListener('input',function(){LOG.pin=i.value.slice(0,16);ldots()});i.addEventListener('keydown',function(e){if(e.key==='Enter')lcheck()});setTimeout(function(){i.focus()},120)}}
function lback(){LOG.cur=null;LOG.pin='';var el=$('#login');el.classList.remove('sel');$$('.pc',el).forEach(function(p){p.classList.remove('cur')});$('#lpin').innerHTML=''}
ACT.lback=lback;
function ldots(){var e=$('#ldots');if(!e)return;var n=Math.max(6,LOG.pin.length),h='';for(var i=0;i<n;i++)h+='<i class="'+(i<LOG.pin.length?'on':'')+'"></i>';e.innerHTML=h;e.classList.remove('bad')}
ACT.lk=function(d){if(LOG.busy)return;var i=$('#lpi');if(d.k==='⌫')LOG.pin=LOG.pin.slice(0,-1);else if(d.k==='✓')return lcheck();else if(LOG.pin.length<16)LOG.pin+=d.k;if(i)i.value=LOG.pin;ldots()};
function lfail(t){var p=$('.pin');LOG.pin='';ldots();var e=$('#ldots');if(e)e.classList.add('bad');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}toast(t);var i=$('#lpi');if(i){i.value='';i.focus()}LOG.busy=0}
function lcheck(){if(LOG.busy)return;if(LOG.pin.length<6)return lfail('Mindestens 6 Zeichen');LOG.busy=1;S.user=LOG.cur;
 syApi('/api/login',{name:LOG.cur,pin:LOG.pin}).then(function(r){if(!r.token)return lfail(r.error||'PIN stimmt nicht');SY.tok=r.token;SY.name=LOG.cur;ls('mflow.tok',r.token);ls('mflow.name',LOG.cur);syStart(r,function(){enter(true)})}).catch(function(){lfail('Zentrale nicht erreichbar')})}
ACT.lgo=function(){S.user=LOG.cur;ls('mflow.name',LOG.cur);save();enter(true)};
function enter(greet){var lg=$('#login');var start=function(){buildShell();applyTheme();lastPg=null;go(S.ui.page&&PAGE[S.ui.page]&&pageOk(S.ui.page)?S.ui.page:'lage')};
 if(!greet||RM){if(lg)lg.remove();start();return}
 var w=document.createElement('div');w.className='welcome';var h=new Date().getHours();w.innerHTML='<h2><span><i>'+(h<11?'Guten Morgen':h<17?'Guten Tag':'Guten Abend')+'</i></span><span><i>'+esc(firstName(S.user))+'</i></span></h2>';document.body.appendChild(w);
 setTimeout(function(){if(lg)lg.remove();start();w.classList.add('out');setTimeout(function(){w.remove()},800)},1300)}

/* =====================================================================
   INTERAKTION: Aktionen, Eingaben, Tastenkürzel, Licht, Welle
   ===================================================================== */
document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;var f=ACT[el.getAttribute('data-act')];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){var el=e.target.closest&&e.target.closest('[data-ent]');if(el&&el.tagName!=='TEXTAREA'){e.preventDefault();var f=ACT[el.getAttribute('data-ent')];if(f)f(el.dataset,el,e)}}});
document.addEventListener('input',function(e){var el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='fq'){S.ui.fq=el.value;var r=$('#fqr');if(r)r.innerHTML=fqRes();var q=el.value.trim().toLowerCase();$$('#stage .cell').forEach(function(c){var f=S.fach.filter(function(x){return x.id===c.dataset.id})[0];c.classList.toggle('hit',!!(q.length>=2&&f&&((f.auf||'').indexOf(q)>=0||fachName(f).toLowerCase().indexOf(q)>=0)))})}
 else if(k==='tz'){var t=S.ui.td||todayIso(),v=el.value.replace(/\D/g,'');if(v!==el.value)el.value=v;tzSet(t,el.dataset.k,v);tzSoft()}
 else if(k==='vq'){S.ui.vq=el.value;clearTimeout(window._vq);window._vq=setTimeout(render,250)}});
document.addEventListener('focusout',function(e){if(e.target&&e.target.dataset&&e.target.dataset.in==='tz')tzSoft()});

var GO=[['l','lage','Lagebild'],['f','fach','Fachverwaltung'],['m','milk','Milkrun'],['t','tz','Tageszahlen'],['q','qs','QS und Störmeldungen'],['u','urlaub','Urlaub und Anwesenheit'],['b','brett','Schwarzes Brett'],['k','funk','Abteilungsfunk'],['v','verl','Verlauf'],['e','adm','Einstellungen'],['w','mon','Werkstattmonitor']],gT=0,gEl=null;
function gOff(){gT=0;if(gEl){gEl.remove();gEl=null}}
ACT.keys=function(){modal('<h3>Tastenkürzel</h3><div class="keys"><span><kbd>Strg</kbd><kbd>K</kbd></span><span>Suche und Perplexity</span><span><kbd>/</kbd></span><span>Suche öffnen</span>'+GO.map(function(g){return '<span><kbd>G</kbd><kbd>'+g[0].toUpperCase()+'</kbd></span><span>'+g[2]+'</span>'}).join('')+'<span><kbd>Esc</kbd></span><span>Schließen</span><span><kbd>?</kbd></span><span>Diese Übersicht</span></div><div class="acts"><button class="btn ghost" data-act="mclose">Schließen</button></div>')};
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if($('#pal'))return closePal();if($('#modal'))return closeModal();if($('#drawer'))return closeDrawer();if($('#flyout.on'))return flyClose();if($('#mon'))return ACT.monx()}
 if(!$('#stage')||$('#login')||$('#intro'))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return openPal()}
 if(e.ctrlKey||e.metaKey||e.altKey)return;var a=document.activeElement,tg=(a&&a.tagName)||'';if(/INPUT|TEXTAREA|SELECT/.test(tg))return;if($('#mon')||$('#pal')||$('#modal'))return;
 if(e.key==='/'){e.preventDefault();return openPal()}
 if(e.key==='?'){e.preventDefault();gOff();return ACT.keys()}
 var k=e.key.toLowerCase();if(gT&&Date.now()-gT<1400){var g=GO.filter(function(x){return x[0]===k})[0];gOff();if(g){e.preventDefault();go(g[1])}return}
 if(k==='g'){gT=Date.now();gEl=document.createElement('div');gEl.className='gh';gEl.innerHTML='<b>G</b> und dann: L Lage · F Fächer · M Milkrun · T Zahlen · <b>?</b> alle';document.body.appendChild(gEl);setTimeout(function(){if(gT&&Date.now()-gT>=1350)gOff()},1450)}});

if(FINE&&!RM){var SP='.tile,.card,.run,.post',cur=null,raf=0,lx=0,ly=0;
 document.addEventListener('pointermove',function(e){lx=e.clientX;ly=e.clientY;if(raf)return;raf=requestAnimationFrame(function(){raf=0;var t=document.elementFromPoint(lx,ly),el=t&&t.closest&&t.closest(SP);if(el&&!el.closest('#stage'))el=null;
  if(el&&el.classList.contains('card')){var inner=t.closest('.tile,.run,.post');if(inner&&el.contains(inner))el=inner}
  if(el!==cur){if(cur)cur.classList.remove('hov');cur=el;if(el){if(!el.querySelector(':scope > .spot')){var s=document.createElement('i');s.className='spot';s.setAttribute('aria-hidden','true');el.appendChild(s)}el.classList.add('hov')}}
  if(cur){var r=cur.getBoundingClientRect();cur.style.setProperty('--mx',(lx-r.left)+'px');cur.style.setProperty('--my',(ly-r.top)+'px')}})},{passive:true})}
if(!RM)document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.btn');if(!b)return;var r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rp';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';b.appendChild(s);setTimeout(function(){s.remove()},650)},{passive:true});

/* Takt: Uhr jede Sekunde, laufende Milkrun-Zeiten, Lagebild jede Minute */
var lastMin=-1;
setInterval(function(){clock();var mc=$('#mck');if(mc)mc.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 $$('[data-since]').forEach(function(e){var s=Math.floor((Date.now()- +e.dataset.since)/1e3);e.textContent='läuft · '+Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)+' Min.'});
 $$('[data-bar]').forEach(function(e){e.style.width=Math.min(100,(Date.now()- +e.dataset.bar)/12e3)+'%'});
 var m=new Date().getMinutes();if(m!==lastMin&&lastMin!==-1&&$('#stage')){var a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(!typing&&!$('#modal')&&!$('#drawer')&&['lage','milk'].indexOf(S.ui.page)>=0)render();else if($('#stage'))shellUpdate()}lastMin=m},1000);

function boot(){
 if(window.MF_SERVER){S=newState();try{var u=JSON.parse(ls(KEY)||'null');if(u&&u.ui)S.ui=Object.assign(S.ui,u.ui)}catch(e){}}
 else{loadState();if(!S.qdemo&&!S.demo&&!S.vacs.some(function(v){return v.demo})){seedDemo(S);S.demo=1;save()}}
 applyTheme();
 var next=function(){if(window.MF_SERVER&&window.syResume){if(!syTok())return showLogin();syResume(function(ok){if(!ok)return showLogin();syStart(null,function(){enter(false)})})}
  else{var nm=ls('mflow.name');if(nm&&TEAM.some(function(t){return t.n===nm})){S.user=nm;enter(false)}else showLogin()}};
 if(shouldIntro()){ls('mf6.intro',todayIso());intro(next)}else next()}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&PAGE[h]&&h!==S.ui.page&&$('#stage'))go(h)});
(function(){var h=location.hash.slice(1);if(h&&(PAGE[h]||h==='mon'))window.__hash=h})();
var _boot=boot;boot=function(){_boot();if(window.__hash){var h=window.__hash;window.__hash=null;var w=setInterval(function(){if($('#stage')){clearInterval(w);go(h)}},200);setTimeout(function(){clearInterval(w)},15000)}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
