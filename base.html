<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>MUNSCH Flow</title>
<meta name="theme-color" content="#04060A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* Konzept: Leitstand-HUD. Tiefes Blauschwarz, Munsch-Orange für Marke und Aktion, kühles Eisblau für Struktur und Daten.
   Alles ist Instrument: Ringe, Skalen, Linien. Eine Hauptbühne (Reaktor) im Lagebild, ruhige Paneele darum. */
:root{--bg:#04060A;--bg2:#0A1019;--pn:rgba(22,21,20,.68);--pn2:rgba(31,29,28,.78);--ln:rgba(241,211,184,.16);--ln2:rgba(241,211,184,.32);
--ink:#E9EFF7;--dim:#F1D3B8;--dim2:#FFA05A;--or:#FF761B;--or2:#FFB07A;--ice:#F1D3B8;--ok:#F1D3B8;--warn:#FFC24B;--crit:#FF5468;--vio:#F1D3B8;
--hud:'Rajdhani','Barlow Condensed','Arial Narrow',sans-serif;--ui:'Geist','Segoe UI',system-ui,sans-serif;--mono:'Geist Mono','Cascadia Mono',ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hud{font-family:var(--hud);letter-spacing:.02em}
.lab{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}.or{color:var(--or)}.ice{color:var(--ice)}.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.vio{color:var(--vio)}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 82% -8%,rgba(255,118,27,.17),transparent 62%),radial-gradient(ellipse 60% 55% at 6% 108%,rgba(255,160,90,.16),transparent 64%),linear-gradient(180deg,#05080D,#04060A)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:56px 56px;opacity:.18;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
/* Gerüst */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ln);background:linear-gradient(180deg,rgba(10,16,25,.92),rgba(7,11,17,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .logo{display:block;height:30px;width:auto}
.top .sys{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.top .sys b{font:600 15px var(--hud);letter-spacing:.2em;color:var(--ink)}
.top .sys span{font:500 10px var(--mono);letter-spacing:.16em;color:var(--dim);white-space:nowrap}
.top .sp{flex:1}
.clock{text-align:right;line-height:1.05}
.clock b{display:block;font:600 28px var(--hud);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.clock span{font:500 11px var(--mono);color:var(--dim);letter-spacing:.06em}
.ibtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--ln2);background:rgba(255,255,255,.03);border-radius:10px;font:500 12px var(--mono);letter-spacing:.06em;color:var(--ink);transition:border-color .2s,background .2s}
.ibtn:hover{border-color:var(--or);background:rgba(255,118,27,.1)}
.ibtn.on{border-color:var(--or);color:var(--or)}
.ibtn svg{width:16px;height:16px}
#menub{display:none}
.tick{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:14px;height:46px;border-bottom:1px solid var(--ln);background:rgba(8,13,20,.72);overflow:hidden}
.tick .tg{flex:none;padding:0 16px 0 max(16px,env(safe-area-inset-left,0px));font:600 12px var(--mono);letter-spacing:.18em;color:var(--or);display:flex;align-items:center;gap:8px}
.tick .tg i{width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 12px var(--or);animation:pulse 1.6s ease-in-out infinite}
.tick .tw{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tick .tr{display:inline-flex;gap:56px;white-space:nowrap;padding-left:100%;animation:scroll var(--sd,70s) linear infinite;font:500 19px var(--hud);letter-spacing:.04em}
.tick .tr span b{color:var(--or);font-weight:600;margin-right:10px}
@keyframes scroll{to{transform:translateX(-100%)}}
@keyframes pulse{50%{opacity:.35}}
.rail{overflow-y:auto;padding:14px 10px 24px max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--ln);background:rgba(7,11,17,.55);scrollbar-width:thin}
.rail h6{margin:16px 10px 6px;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
.rail h6:first-child{margin-top:0}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;background:none;text-align:left;font:500 13.5px var(--ui);color:var(--dim);transition:color .15s,background .15s}
.nv:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.nv.on{color:var(--ink);border-left-color:var(--or);background:linear-gradient(90deg,rgba(255,118,27,.16),transparent)}
.nv .bd{margin-left:auto;min-width:20px;padding:1px 6px;border-radius:99px;font:600 10.5px var(--mono);background:rgba(255,84,104,.18);color:var(--crit);text-align:center}
.nv .bd.w{background:rgba(255,194,75,.16);color:var(--warn)}
#view{overflow-y:auto;overflow-x:hidden;padding:22px max(18px,env(safe-area-inset-right,0px)) 80px 22px;scrollbar-width:thin;scroll-behavior:smooth}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.vh .k{font:500 11px var(--mono);letter-spacing:.2em;color:var(--or);text-transform:uppercase}
.vh h1{margin:4px 0 0;font:600 clamp(28px,3.4vw,42px)/1 var(--hud);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.vh .ra{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:1/-1}
@media(max-width:1180px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:1/-1}}
@media(max-width:700px){.c3,.c4,.c5,.c6{grid-column:1/-1}}
/* Paneel */
.pn{position:relative;min-width:0;padding:18px 20px;background:var(--pn);border:1px solid var(--ln);border-radius:4px 18px 4px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 50px -30px #000}
.pn::before,.pn::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:1px solid var(--or);opacity:.85}
.pn::before{left:-1px;top:-1px;border-width:2px 0 0 2px}
.pn::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.pn.flat{padding:0;overflow:hidden}
.pn.al{border-color:rgba(255,84,104,.5)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph .lab{display:flex;align-items:center;gap:8px}
.ph .lab::before{content:"";width:6px;height:6px;background:var(--ice);transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--ln2);border-radius:99px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--dim);white-space:nowrap;background:rgba(255,255,255,.03)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);border-color:rgba(241,211,184,.4);background:rgba(241,211,184,.07)}.chip.warn{color:var(--warn);border-color:rgba(255,194,75,.4);background:rgba(255,194,75,.07)}.chip.crit{color:var(--crit);border-color:rgba(255,84,104,.45);background:rgba(255,84,104,.08)}.chip.or{color:var(--or);border-color:rgba(255,118,27,.5);background:rgba(255,118,27,.09)}.chip.ice{color:var(--ice);border-color:rgba(241,211,184,.4)}.chip.vio{color:var(--vio);border-color:rgba(241,211,184,.45);background:rgba(241,211,184,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:9px;border:1px solid var(--ln2);background:rgba(255,255,255,.04);font:500 13px var(--ui);color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--or);border-color:var(--or);color:#1A0C02;font-weight:600}
.btn.pri:hover{background:var(--or2);border-color:var(--or2)}
.btn.ok{color:var(--ok);border-color:rgba(241,211,184,.45)}.btn.no{color:var(--crit);border-color:rgba(255,84,104,.45)}
.btn.sm{min-height:28px;padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border-radius:9px;border:1px solid var(--ln2);background:rgba(4,8,13,.7);outline:none;color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
input[type=checkbox]{width:18px;min-height:18px;height:18px;accent-color:var(--or)}
select option{background:#0C121B}
textarea{min-height:76px;resize:vertical}
label.f{display:grid;gap:5px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:0}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.frow>*{flex:1 1 150px}
.frow>.btn{flex:0 0 auto}
/* Zahlen */
.big{font:600 clamp(44px,5.4vw,78px)/.95 var(--hud);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.mid{font:600 34px/1 var(--hud);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.kv:first-of-type{border-top:0}
.kv b{font:500 13px var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl{padding:12px 14px;border:1px solid var(--ln);border-radius:3px 12px 3px 12px;background:rgba(255,255,255,.025)}
.tl .v{font:600 30px/1 var(--hud);font-variant-numeric:tabular-nums;margin-top:6px}
.tl .d{font:500 11px var(--mono);color:var(--dim);margin-top:4px}
/* Reaktor */
.reactor{position:relative;display:flex;align-items:center;justify-content:center}
.reactor svg{width:100%;max-width:420px;height:auto;overflow:visible}
.rot1{transform-origin:200px 200px;animation:rot 60s linear infinite}
.rot2{transform-origin:200px 200px;animation:rot 90s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.rc b{font:600 clamp(44px,6vw,72px)/1 var(--hud);letter-spacing:.04em;font-variant-numeric:tabular-nums}
/* Tabelle */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{padding:9px 12px;text-align:left;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--ln2);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.03)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Fächer */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.fc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;min-height:50px;border-radius:3px 9px 3px 9px;border:1px solid var(--ln);background:rgba(255,255,255,.02);text-align:left;font:500 11px var(--mono);color:var(--dim);transition:transform .12s,border-color .15s}
.fc:hover{transform:translateY(-2px);border-color:var(--ice)}
.fc b{font:600 15px var(--hud);color:var(--ink)}
.fc.o{border-color:rgba(255,118,27,.55);background:rgba(255,118,27,.12);color:var(--or2)}
.fc.l{border-color:rgba(241,211,184,.7);background:rgba(241,211,184,.15);color:var(--vio);box-shadow:0 0 18px -6px var(--vio)}
.fc.a{border-style:dashed;border-color:rgba(255,118,27,.4);background:rgba(255,118,27,.05)}
.fc.hit{outline:2px solid var(--ice);outline-offset:1px}
/* Zeitleiste Urlaub */
.tlr{display:grid;grid-template-columns:150px repeat(21,minmax(26px,1fr));align-items:center;min-width:760px}
.tlr>*{min-height:34px;display:flex;align-items:center}
.tlh{justify-content:center;font:500 10px var(--mono);color:var(--dim);text-align:center;line-height:1.2}
.tlh.we{color:var(--dim2)}.tlh.td{color:var(--or)}
.cell{border-top:1px solid var(--ln);justify-content:center;height:34px}
.cell.we{background:rgba(255,255,255,.025)}
.cell.g::after,.cell.p::after,.cell.k::after,.cell.z::after{content:"";width:100%;height:14px}
.cell.g::after{background:var(--ok);opacity:.85}.cell.p::after{background:repeating-linear-gradient(135deg,var(--or) 0 4px,rgba(255,118,27,.4) 4px 8px)}.cell.k::after{background:var(--crit)}.cell.z::after{background:var(--ice);opacity:.8}
.bar{display:inline-block;height:5px;border-radius:3px;background:rgba(255,255,255,.1);width:100%;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--or),var(--or2))}
/* Modal, Toast */
.mb{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,4,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.md{width:min(560px,100%);max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;padding:11px 18px;border-radius:12px;background:#181716;border:1px solid var(--or);font:500 13px var(--ui);box-shadow:0 18px 50px #000;max-width:90vw}
/* Assistent */
#jv{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(400px,100%);display:flex;flex-direction:column;background:rgba(7,11,17,.96);border-left:1px solid var(--ln2);box-shadow:-30px 0 80px #000;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#jv.on{transform:none}
.jh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--ln)}
.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD9B8,var(--or) 45%,#6A2A00);box-shadow:0 0 22px rgba(255,118,27,.7);animation:pulse 3s ease-in-out infinite}
#jl{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.jm{max-width:92%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.jm.u{align-self:flex-end;background:rgba(255,118,27,.16);border:1px solid rgba(255,118,27,.4)}
.jm.a{align-self:flex-start;background:rgba(241,211,184,.08);border:1px solid var(--ln2)}
.jq{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.jf{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--ln)}
/* Overlays */
#boot{position:fixed;inset:0;z-index:100;background:#030509;overflow:hidden}
#boot canvas{position:absolute;inset:0;width:100%;height:100%}
#mon,#stn{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mn{flex:1;min-height:0;padding:18px 28px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.mn .big{font-size:clamp(56px,9vw,150px)}
body.big{font-size:17px}
@media(max-width:980px){#app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(290px,86vw);transform:translateX(-105%);transition:transform .3s;background:rgba(5,8,13,.98);padding-top:calc(14px + env(safe-area-inset-top,0px))}.rail.on{transform:none}#menub{display:inline-flex}.clock b{font-size:22px}.top .sys{display:none}.tick{height:40px}#view{padding:16px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}.tick .tr{font-size:16px}}
@media(max-width:560px){.top{gap:8px}.top .logo{height:24px}.hide-s{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* ===== PRO-LAYER: flächig, tabellarisch, ohne Kacheln ===== */
:root{--bg:#070A10}
body{font:400 14px/1.5 var(--ui)}
.top{background:#0A0E15;backdrop-filter:none;-webkit-backdrop-filter:none}
.top .sys b{letter-spacing:.12em;font-size:14px}
.top .sys span{letter-spacing:.06em;font-family:var(--ui);font-size:11px}
.clock b{font:600 24px var(--ui);letter-spacing:0}
.clock span{font-family:var(--ui)}
.tick{background:#080C12;height:40px}
.tick .tr{font:500 14px var(--ui);letter-spacing:0}
.tick .tg{font:600 11px var(--ui);letter-spacing:.1em}
.ibtn,.btn{border-radius:5px}
.ibtn{font:500 13px var(--ui);letter-spacing:0;background:none}
.rail{background:#080C12;border-right:1px solid var(--ln)}
.rail h6{font:600 11px var(--ui);letter-spacing:.04em;text-transform:none;color:var(--dim2);margin:20px 10px 6px}
.nv{border-radius:0;font-size:13.5px;padding:7px 10px}
.nv.on{background:rgba(255,118,27,.1);color:#fff}
#view{padding:26px max(24px,env(safe-area-inset-right,0px)) 90px 32px}
.vh{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--ln2);align-items:flex-end}
.vh .k{font:500 12px var(--ui);letter-spacing:0;text-transform:none;color:var(--or)}
.vh h1{font:600 clamp(24px,2.6vw,32px)/1.15 var(--ui);letter-spacing:-.01em;text-transform:none}
.lab{font:500 12px var(--ui);letter-spacing:0;text-transform:none;color:var(--dim)}
/* Bereiche statt Kästen */
.grid{gap:6px 44px}
.pn{background:none;border:0;border-top:1px solid var(--ln2);border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:14px 0 22px}
.pn::before,.pn::after{display:none}
.pn.al{border-top-color:var(--crit)}
.ph{margin-bottom:12px}
.ph .lab{font:600 14px var(--ui);color:var(--ink)}
.ph .lab::before{display:none}
.md.pn,.mb .pn{background:#0C121B;border:1px solid var(--ln2);border-radius:8px;padding:22px;box-shadow:0 30px 80px #000}
.mb .ph .lab{font-size:15px}
/* Kennzahlen als Leiste */
.tiles{display:flex;flex-wrap:wrap;gap:18px 0;grid-template-columns:none!important}
.tl{flex:1 1 150px;padding:2px 22px;border:0;border-left:1px solid var(--ln);border-radius:0;background:none}
.tl:first-child{padding-left:0;border-left:0}

.bgfx{background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(255,160,90,.20),transparent 70%),radial-gradient(ellipse 50% 40% at 90% -5%,rgba(255,118,27,.15),transparent 62%),radial-gradient(ellipse 50% 45% at 0 105%,rgba(255,160,90,.16),transparent 64%),repeating-radial-gradient(circle at 50% 42%,transparent 0 96px,rgba(255,160,90,.06) 96px 97px),linear-gradient(180deg,#04090F,#02050A)}

.bgfx::before{opacity:.8;background:conic-gradient(from 0deg,rgba(255,160,90,.16),rgba(255,160,90,0) 14%,transparent)}
#hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(241,211,184,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#hud .scan{display:block;height:2px;top:0;background:linear-gradient(90deg,transparent,rgba(255,160,90,.8),transparent);opacity:.35;border:0;animation:scan2 9s linear infinite}
@keyframes scan2{from{transform:translateY(0)}to{transform:translateY(100vh)}}
#hud .rt{width:34px;height:34px;border-color:var(--ice);filter:drop-shadow(0 0 6px var(--ice))}
#hud .ruler{opacity:.65}
#hud .tele{color:rgba(255,160,90,.7);font-size:10.5px;letter-spacing:.16em}
/* Kopf */
.top{background:linear-gradient(180deg,rgba(26,25,23,.92),rgba(4,12,20,.7));border-bottom:1px solid var(--ln2)}
.top::after{height:2px;width:100%;left:0;background:linear-gradient(90deg,transparent,var(--ice) 20%,var(--or) 50%,var(--ice) 80%,transparent);background-size:200% 100%;animation:flow 6s linear infinite;filter:drop-shadow(0 0 6px var(--ice));opacity:.9}
@keyframes flow{to{background-position:200% 0}}
.top .sys b{font:700 20px var(--hud);letter-spacing:.42em;color:#fff;text-shadow:0 0 16px rgba(255,118,27,.8)}
.top .sys span{font:500 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ice)}
.clock b{font:600 34px var(--hud);letter-spacing:.1em;color:var(--ice2);text-shadow:var(--hudglow)}
.clock span{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tick{background:rgba(16,16,15,.8);border-bottom:1px solid var(--ln)}
.tick .tr{font:500 17px var(--hud);letter-spacing:.06em;color:var(--ice2)}
.tick .tg{font:700 12px var(--mono);letter-spacing:.3em;color:var(--or)}
/* Navigation */
.rail{background:linear-gradient(90deg,rgba(20,19,18,.85),rgba(4,12,20,.4));border-right:1px solid var(--ln2)}
.rail h6{font:600 10.5px var(--mono);letter-spacing:.28em;color:var(--ice);opacity:.75;margin:22px 12px 6px;position:relative}
.rail h6::after{content:"";position:absolute;left:0;right:12px;bottom:-4px;height:1px;background:linear-gradient(90deg,var(--ln2),transparent)}
.nv{font:600 15px var(--hud);letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;color:var(--dim);border-left:2px solid transparent}
.nv:hover{color:var(--ice2);background:linear-gradient(90deg,rgba(255,160,90,.1),transparent);text-shadow:0 0 10px rgba(255,160,90,.6)}
.nv.on{color:#fff;border-left-color:var(--or);background:linear-gradient(90deg,rgba(255,118,27,.26),rgba(255,160,90,.04) 70%,transparent);box-shadow:inset 18px 0 22px -18px rgba(255,118,27,.8);text-shadow:0 0 12px rgba(255,160,90,.8)}
.nv.on::before{content:"▸";color:var(--or);margin-right:-4px}
.rail::after{font:700 11px var(--mono);letter-spacing:.3em;color:var(--ok);text-shadow:0 0 10px rgba(241,211,184,.8)}
/* Titel */
.vh::before{height:2px;background:linear-gradient(90deg,var(--or),var(--ice) 25%,transparent 80%);box-shadow:0 0 10px rgba(255,160,90,.6)}
.vh .k{font:600 11.5px var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--or)}
.vh .k::before{content:"// ";color:var(--ice)}
.vh h1{font:700 clamp(32px,3.8vw,52px)/1 var(--hud);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 0 30px rgba(255,160,90,.55),0 0 2px rgba(255,255,255,.6)}
.ph .lab{font:700 15px var(--hud);letter-spacing:.22em;text-transform:uppercase;color:var(--ice2);text-shadow:0 0 12px rgba(255,160,90,.55)}
.ph .lab::before{width:9px;height:9px;border:1.5px solid var(--or);background:rgba(255,118,27,.25);transform:rotate(45deg);box-shadow:0 0 10px var(--or)}
.ph .lab::after{height:1px;background:linear-gradient(90deg,var(--ice),transparent);box-shadow:0 0 6px var(--ice)}
.lab,.tl .lab{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
/* Holo-Rahmen statt Kästen */
.pn{padding:18px 20px 24px;border:1px solid rgba(255,160,90,.1);background:
 linear-gradient(var(--ice),var(--ice)) 0 0/22px 2px no-repeat,linear-gradient(var(--ice),var(--ice)) 0 0/2px 22px no-repeat,
 linear-gradient(var(--ice),var(--ice)) 100% 0/22px 2px no-repeat,linear-gradient(var(--ice),var(--ice)) 100% 0/2px 22px no-repeat,
 linear-gradient(var(--or),var(--or)) 0 100%/22px 2px no-repeat,linear-gradient(var(--or),var(--or)) 0 100%/2px 22px no-repeat,
 linear-gradient(var(--or),var(--or)) 100% 100%/22px 2px no-repeat,linear-gradient(var(--or),var(--or)) 100% 100%/2px 22px no-repeat,
 linear-gradient(135deg,rgba(255,160,90,.06),rgba(255,160,90,.01) 60%);box-shadow:inset 0 0 50px rgba(255,160,90,.04)}
.pn.al{border-color:rgba(255,84,104,.4)}
.grid{gap:22px 26px}
.md.pn,.mb .pn{background:linear-gradient(135deg,rgba(30,29,27,.97),rgba(5,14,22,.98));border:1px solid var(--ln2);border-radius:0;box-shadow:0 0 60px rgba(255,160,90,.15),0 30px 80px #000}
/* Ziffern */
.big,.mid,.tl .v,.rc b{font-family:var(--hud);font-weight:600;color:#fff;letter-spacing:.02em;text-shadow:0 0 22px rgba(255,160,90,.6)}
.tl{border-left:1px solid var(--ln2)}
.tl .v{font-size:36px}
/* Bedienelemente */
.btn{background:rgba(255,160,90,.06);border:1px solid var(--ln2);color:var(--ice2);font:600 13px var(--hud);letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);border-radius:0}
.btn:hover{background:rgba(255,160,90,.16);border-color:var(--ice);color:#fff;text-shadow:0 0 10px var(--ice)}
.btn.pri{background:var(--or);border-color:var(--or);color:#1A0C02;box-shadow:0 0 24px -2px rgba(255,118,27,.8);text-shadow:none}
.btn.pri:hover{background:var(--or2);color:#1A0C02;text-shadow:none}
.btn.ok{color:var(--ok)}.btn.no{color:var(--crit)}
.ibtn{border:1px solid var(--ln2);background:rgba(255,160,90,.05);color:var(--ice2);font:600 12px var(--hud);letter-spacing:.14em;text-transform:uppercase;border-radius:0;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.ibtn:hover{border-color:var(--or);color:#fff}
.chip{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:0;border:1px solid var(--ln2);background:rgba(255,160,90,.06);color:var(--ice2);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.chip.ok{color:var(--ok);border-color:rgba(241,211,184,.6)}.chip.warn{color:var(--warn);border-color:rgba(255,194,75,.6)}.chip.crit{color:var(--crit);border-color:rgba(255,84,104,.65)}
input,select,textarea{background:rgba(15,14,13,.75);border:0;border-bottom:1px solid var(--ln2);border-radius:0;color:#fff;box-shadow:inset 0 0 20px rgba(255,160,90,.04)}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--or);box-shadow:inset 0 -12px 16px -12px rgba(255,118,27,.5)}
label.f{font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ice);opacity:.85}
.srch{background:rgba(15,14,13,.75);border:0;border-bottom:1px solid var(--ln2);border-radius:0;color:var(--ice2)}
kbd{border-color:var(--ln2);color:var(--ice)}
/* Tabellen */
table.t th{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ice);border-bottom:1px solid var(--ln2)}
table.t td{border-bottom:1px solid rgba(255,160,90,.1)}
table.t tr:hover td{background:linear-gradient(90deg,rgba(255,160,90,.1),transparent)}
.bar{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,rgba(255,160,90,.14) 0 6px,transparent 6px 8px)}
.bar i{background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 8px)!important;filter:drop-shadow(0 0 5px currentColor);border-radius:0}
.fc{border-bottom-color:rgba(255,160,90,.12)}
.fc.o{border-left-color:var(--or);background:linear-gradient(90deg,rgba(255,118,27,.14),transparent)}
/* Reaktor */
.reactor svg{width:min(100%,640px);filter:drop-shadow(0 0 40px rgba(255,160,90,.28))}
.rc b{font-size:clamp(46px,5.4vw,74px)}
.gau{display:flex;flex-wrap:wrap;justify-content:space-around;gap:18px;margin:4px 0 22px}
.gau svg circle:last-child{filter:drop-shadow(0 0 8px currentColor)}
/* Tagesablauf, Suche, Meldungen, Jarvis */
.dm{box-shadow:0 0 10px currentColor}.dm.ok{box-shadow:0 0 12px var(--ok)}.dm.crit{box-shadow:0 0 12px var(--crit)}
.dnow{border-left:1px solid var(--or);box-shadow:0 0 12px var(--or)}
.dax i span{color:var(--ice)}
#pal .pb,#bellp,#tip{background:linear-gradient(135deg,rgba(30,29,27,.97),rgba(5,14,22,.98));border:1px solid var(--ln2);border-radius:0;box-shadow:0 0 60px rgba(255,160,90,.18),0 30px 80px #000}
.pi.on{background:linear-gradient(90deg,rgba(255,118,27,.18),transparent);border-left-color:var(--or)}
#jv{background:linear-gradient(180deg,rgba(20,19,18,.97),rgba(3,9,15,.98));border-left:1px solid var(--ice);box-shadow:-20px 0 80px rgba(255,160,90,.12)}
.jm{border-radius:0;font-size:13.5px}
.jm.a{background:rgba(255,160,90,.07);border:1px solid var(--ln2);border-left:3px solid var(--ice)}
.jm.u{background:rgba(255,118,27,.12);border:1px solid rgba(255,118,27,.5);border-left:1px solid rgba(255,118,27,.5);border-right:3px solid var(--or)}
.orb{box-shadow:0 0 26px rgba(255,118,27,.9),0 0 60px rgba(255,160,90,.3)}
#jorb{border-radius:0;border-color:var(--ice);box-shadow:0 0 30px rgba(255,160,90,.35);clip-path:none;background:rgba(15,14,13,.9);color:var(--ice2)}
.warn,.crit,.ok{}
@media(max-width:980px){.grid{gap:16px}.pn{padding:14px 14px 20px}#hud .rt{width:22px;height:22px}}
.rail .nv{font-size:14px;letter-spacing:.06em;padding:8px 12px;overflow-wrap:anywhere}
#view .nv{font:500 13.5px var(--ui);letter-spacing:0;text-transform:none;color:var(--ink)}
#view .nv:hover{text-shadow:none}
.rail .nv{font-size:13.5px;letter-spacing:.03em;overflow-wrap:normal}
@media(min-width:981px){#app{grid-template-columns:262px minmax(0,1fr)}}
#hud .tele{left:280px}

/* ===== LAGERRAD ===== */
.wstage{position:relative;max-width:760px;margin:0 auto}
.wheel{display:block;width:100%;height:auto;filter:drop-shadow(0 0 40px rgba(255,160,90,.16))}
.wheel .rg{fill:none;stroke:rgba(255,160,90,.28);stroke-width:1}.wheel .rg.or{stroke:#FF761B;stroke-width:3;stroke-opacity:.8}
.sg{fill:rgba(255,160,90,.07);stroke:rgba(255,160,90,.38);stroke-width:.8;cursor:pointer;transition:fill .15s,opacity .2s}
.sg:hover{fill:rgba(255,160,90,.35);stroke:#fff}
.sg.o{fill:rgba(255,118,27,.62);stroke:rgba(255,160,90,.9)}
.sg.a{fill:rgba(255,118,27,.2);stroke:rgba(255,118,27,.8);stroke-dasharray:3 2}
.sg.l{fill:rgba(241,211,184,.82);stroke:#F1D3B8;filter:drop-shadow(0 0 5px rgba(241,211,184,.9))}
.sg.dm{opacity:.12}.sp.dm{opacity:.08}
.sg.hit{stroke:#fff;stroke-width:2.2;animation:hitp 1s ease-in-out infinite}
@keyframes hitp{50%{filter:drop-shadow(0 0 10px #fff)}}
.sg.sel{stroke:#fff;stroke-width:3;fill:rgba(255,255,255,.28);filter:drop-shadow(0 0 10px #fff)}
.sg.sel.o{fill:rgba(255,118,27,.95)}.sg.sel.l{fill:rgba(241,211,184,1)}
.sp{stroke:#FF761B;stroke-width:2.2;stroke-linecap:round;pointer-events:none}.sp.l{stroke:#F1D3B8}
.wheel .tk{stroke:rgba(255,160,90,.6)}.wheel text{font:500 11px var(--mono);fill:#A8A39A;letter-spacing:.06em}.wheel .wt{fill:#FFA05A;letter-spacing:.3em;font-size:11px}
.whub{position:absolute;left:50%;top:50%;width:35%;aspect-ratio:1;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(3,10,18,.9) 60%,transparent 72%)}
.whub .wn{font:600 clamp(44px,6.5vw,84px)/1 var(--hud);color:#fff;text-shadow:0 0 26px rgba(255,160,90,.7)}.whub .wn small{font-size:.4em;margin-left:2px;color:var(--ice)}
.whub .wa{font:600 clamp(15px,1.8vw,22px) var(--mono);color:var(--or2);letter-spacing:.06em}
.wk{display:flex;gap:14px;margin-top:6px;font:500 11px var(--ui);color:var(--dim)}.wk b{display:block;font:600 24px var(--hud);color:#fff}
.wleg{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;margin-top:10px;font:400 12px var(--ui);color:var(--dim)}
.wleg i{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--ice);vertical-align:-1px}
.wleg i.o{background:#FF761B;border-color:#FF761B}.wleg i.l{background:#F1D3B8;border-color:#F1D3B8}.wleg i.a{border-style:dashed;border-color:#FF761B;background:rgba(255,118,27,.2)}
@media(max-width:700px){.whub{width:40%}.whub .wk{display:none}}
.lcore{display:block;margin-bottom:4px;filter:drop-shadow(0 0 12px rgba(255,118,27,.75)) drop-shadow(0 0 26px rgba(255,160,90,.35))}
.lc-i{transform-origin:65.3px 65.3px;animation:rot 18s linear infinite}
.lc-r{transform-origin:65.3px 65.3px;animation:rot 6s linear infinite}
.rc b{font-size:clamp(30px,3.4vw,44px)!important;margin-top:2px}
.reactor .rc svg.lcore{width:clamp(70px,8vw,96px);height:auto;max-width:none}
.rc{gap:2px}

/* ===== FACHRASTER ===== */
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.fx{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:7px 9px 8px;min-height:62px;text-align:left;border:1px solid rgba(255,160,90,.3);background:rgba(255,160,90,.04);color:var(--dim);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background .15s,transform .1s}
.fx b{font:600 16px var(--hud);letter-spacing:.08em;color:var(--ice2)}
.fx span{font:500 11px var(--mono);letter-spacing:.02em}

.fx:hover{background:rgba(255,160,90,.16);border-color:var(--ice)}
.fx.o{background:rgba(255,118,27,.20);border-color:rgba(255,140,60,.8);color:#FFD9BD}.fx.o b{color:#fff}
.fx.a{background:rgba(255,118,27,.07);border:1px dashed rgba(255,118,27,.7);color:var(--or2)}
.fx.l{background:rgba(241,211,184,.26);border-color:#F1D3B8;color:#F1D3B8;box-shadow:0 0 14px -4px #F1D3B8}.fx.l b{color:#fff}.fx.l em{color:#F1D3B8}
.fx.dm{opacity:.14}
.fx.hit{outline:2px solid #fff;outline-offset:1px;animation:hitp 1s ease-in-out infinite}
.fx.sel{outline:2px solid var(--ice);outline-offset:2px;background:rgba(255,160,90,.28)}.fx.sel.o{background:rgba(255,118,27,.5)}
@media(max-width:700px){.fxg{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.fx{min-height:56px}}

/* ===== FACHVERWALTUNG: Arbeitsfluss ===== */
.big-in{min-height:52px!important;font:600 22px var(--mono)!important;letter-spacing:.08em}
.target{display:flex;align-items:baseline;gap:14px;margin:14px 0 12px}
.target b{font:700 40px var(--hud);color:#fff;letter-spacing:.08em;text-shadow:0 0 22px rgba(255,160,90,.6)}
.okline{margin-top:12px;padding:8px 12px;border-left:3px solid var(--ok);background:rgba(241,211,184,.08);color:var(--ok);font:500 13px var(--ui)}
.hits{margin-top:12px;display:grid;gap:0}
.hitrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.hitrow b{font:700 20px var(--hud);letter-spacing:.08em;color:#fff;min-width:64px}.hitrow span{font:500 13px var(--mono);color:var(--dim)}
.gr{flex:1}
.selbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;margin-bottom:14px;border:1px solid var(--ice);background:rgba(255,160,90,.08)}
.selbar b{font:700 24px var(--hud);letter-spacing:.08em;color:#fff}.selbar span{font:500 13px var(--mono);color:var(--ice2)}
input.mini{width:130px;min-height:32px;font-size:13px}
.fbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:6px}
.vtg{display:flex;gap:6px}.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fxg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.fx2{height:38px;padding:0;border:1px solid rgba(255,160,90,.32);background:rgba(255,160,90,.05);color:var(--ice2);font:600 13px var(--mono);letter-spacing:.02em;transition:background .12s}
.fx2:hover{background:rgba(255,160,90,.28);border-color:#fff;color:#fff}
.fx2.o{background:rgba(255,118,27,.34);border-color:rgba(255,140,60,.9);color:#fff}
.fx2.a{background:rgba(255,118,27,.1);border:1px dashed rgba(255,118,27,.75);color:var(--or2)}
.fx2.l{background:rgba(241,211,184,.5);border-color:#F1D3B8;color:#fff;box-shadow:0 0 12px -3px #F1D3B8}
.fx2.dm{opacity:.13}
.fx2.hit{outline:2px solid #fff;outline-offset:1px;animation:hitp 1s ease-in-out infinite;z-index:1}
.fx2.sel{outline:2px solid var(--ice);outline-offset:2px;background:rgba(255,160,90,.4)}.fx2.sel.o{background:rgba(255,118,27,.7)}
@media(max-width:700px){.fxg2{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}.target b{font-size:34px}}
@media(max-width:700px){h1{font-size:clamp(20px,6.6vw,30px)!important;letter-spacing:.04em!important;overflow-wrap:anywhere}.hitrow{flex-wrap:wrap}}

/* ===== INTRO: Reaktor ===== */
#boot{display:flex!important;flex-direction:column;background:radial-gradient(ellipse at 50% 38%,#1B1A18 0,#04070c 62%),#04070c;overflow:hidden}
#boot::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,160,90,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,160,90,.05) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask:radial-gradient(circle at 50% 40%,#000 0,transparent 70%);mask:radial-gradient(circle at 50% 40%,#000 0,transparent 70%)}
.hs-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vh,22px);padding-top:max(52px,env(safe-area-inset-top,0px));position:relative;z-index:2}
.hs{position:relative;width:min(86vw,52vh,520px);aspect-ratio:1;flex:none}
.hs-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hs-sweep{position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,rgba(255,160,90,.30) 359deg,transparent 360deg);animation:hsr 4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 24%,#000 25%);mask:radial-gradient(circle,transparent 24%,#000 25%)}
.hs-glow{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,rgba(255,118,27,.34),transparent 68%);animation:hsg 3s ease-in-out infinite}
.hs-ticks line{stroke:#FFA05A;stroke-width:1.2;opacity:.75}
.hs-track{fill:none;stroke:rgba(255,160,90,.16);stroke-width:5}
.hs-prog{fill:none;stroke:#FF761B;stroke-width:5;stroke-dasharray:100;stroke-dashoffset:calc(100 - 100*var(--p,0));transition:stroke-dashoffset .5s;filter:drop-shadow(0 0 6px #FF761B)}
.hs-seg{fill:none;stroke:#FFA05A;stroke-width:2;stroke-dasharray:26 9;opacity:.55}
.hs-notch rect{fill:#FF761B}
.hs-thin{fill:none;stroke:rgba(241,211,184,.55);stroke-width:1}

#lx .dots.bad i{background:#FF5A50;border-color:#FF5A50;box-shadow:0 0 16px #FF5A50}
#lx .msg{min-height:20px;text-align:center;font-size:13px;color:var(--dim);margin-bottom:12px}
#lx .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#lx .kp button{height:58px;border-radius:16px;font-size:24px;font-weight:300;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);position:relative;overflow:hidden;color:var(--ink);cursor:pointer}

#lx .kp .rp{position:absolute;border-radius:50%;background:rgba(255,160,90,.55);transform:scale(0);animation:lxrp .6s ease-out forwards;pointer-events:none}
@keyframes lxrp{to{transform:scale(4);opacity:0}}
#lx .kp .okb{background:linear-gradient(180deg,#FFA05A,#FF761B);color:#1A0C02;border-color:transparent;box-shadow:0 8px 30px -6px rgba(255,118,27,.7)}

#lx .win.on .w2 span{animation:lxwz 1.6s var(--e) forwards;animation-delay:calc(.5s + var(--i)*160ms)}
@keyframes lxwz{to{opacity:1;transform:none;filter:none}}
